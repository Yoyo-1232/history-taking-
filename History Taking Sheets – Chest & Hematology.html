<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f8fb;--card:#fff;--tx:#1b2430;--mu:#66758a;--ac:#1f5fa8;--bd:#d5dce6;--chip:#eaf1fa}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171e;--card:#1b222b;--tx:#e8edf3;--mu:#9aa8ba;--ac:#6fa8f0;--bd:#303a47;--chip:#243142}}
:root[data-theme="dark"]{--bg:#12171e;--card:#1b222b;--tx:#e8edf3;--mu:#9aa8ba;--ac:#6fa8f0;--bd:#303a47;--chip:#243142}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
main{max-width:760px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:10px 0 2px;color:var(--ac)}
.sub{color:var(--mu);font-size:13px;margin-bottom:12px}
.tabs{display:flex;gap:6px;padding:4px;background:var(--chip);border:1px solid var(--bd);border-radius:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tabs button{flex:1;padding:10px;background:transparent;color:var(--tx);border-radius:9px}
.tabs button.on{background:var(--ac);color:#fff}
details{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin:10px 0;padding:0 12px}
summary{font-weight:700;padding:12px 0;cursor:pointer;color:var(--ac)}
.f{margin:0 0 12px}
.f>b{display:block;font-size:14px;margin-bottom:4px}
.h{color:var(--mu);font-size:12px;margin:-2px 0 4px}
h3{font-size:14px;margin:14px 0 8px;padding-top:8px;border-top:1px dashed var(--bd);color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
input[type=text],textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:64px;resize:vertical}
.ch{display:flex;flex-wrap:wrap;gap:6px}
.ch label{background:var(--chip);border:1px solid var(--bd);border-radius:999px;padding:6px 11px;font-size:14px;cursor:pointer}
.ch input{display:none}
.ch label:has(input:checked){background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row input{width:90px}
.bar{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 0 14px;background:linear-gradient(transparent,var(--bg) 30%)}
button{flex:1;padding:12px;border:0;border-radius:10px;font:600 15px inherit;font-family:inherit;background:var(--ac);color:#fff;cursor:pointer}
button.s{background:var(--chip);color:var(--tx);border:1px solid var(--bd);flex:0 0 auto}
#msg{font-size:13px;color:var(--mu);min-height:18px}
</style></head><body><main>
<div class="tabs"><button id="t_chest">Chest</button><button id="t_heme">Hematology</button></div>
<h1 id="ttl"></h1>
<div class="sub">Tap to fill. Entries auto-save on this device, separately for each sheet. Export the open sheet to Word or PDF.</div>
<div id="app"></div><div id="msg"></div>
<div class="bar"><button id="ex">Word (.docx)</button><button id="pf">PDF</button><button class="s" id="cl">Clear</button></div>
</main>

async function dl(make,ext){const m=$('msg');
try{const d=await claude.use('downloads');
if(!d){m.textContent='Saving files isn’t available in this view. Open the published link in Claude to export.';return}
const blob=await make();await d.save({filename:fname()+ext,data:blob});m.textContent='Saved.'
}catch(e){m.textContent=e&&e.code=='declined'?'Export cancelled.':'Export failed: '+((e&&e.message)||'unknown error')}}

z.file('_rels/.rels','<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
z.file('word/document.xml',docx());return z.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'})},'.docx');
